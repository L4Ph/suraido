name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deployment replaces whatever is live, so one at a time, and let a run in
# progress finish rather than cancelling it half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package.json asks for this through devEngines, and npm refuses every
      # command in the repository until it has it.
      - run: npm install -g npm@12.0.2

      - run: npm ci

      # The showcase imports suraido.js, which is served from dist.
      - run: npx vp pack
        working-directory: packages/suraido

      - run: npx vp build
        working-directory: examples/showcase
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
