name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deployment replaces whatever is live, so one at a time, and let a run in
# progress finish rather than cancelling it half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Brings its own Node and package manager, so devEngines is satisfied without
      # installing a particular npm by hand.
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      # First, because everything else resolves these through dist — including their types.
      # Without it vp check cannot find the JSX namespace and reports the examples as 424
      # errors.
      - run: vp -C packages/suraido pack
      - run: vp -C packages/cli pack

      - run: vp check
      - run: vp test

      # Exporting for real is the only way to know a browser still walks a deck and lays it
      # out. basic rather than showcase, because the deployed one is built with a base path
      # and would ask for its assets somewhere the exporter is not serving them.
      - run: vp build
        working-directory: examples/basic
      - run: node packages/cli/dist/cli.mjs export examples/basic/dist --pdf --out /tmp/deck.pdf
      - run: test -s /tmp/deck.pdf

      - run: vp build
        working-directory: examples/showcase
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
