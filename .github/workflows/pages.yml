name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deployment replaces whatever is live, so one at a time, and let a run in
# progress finish rather than cancelling it half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Brings its own Node and package manager, so devEngines is satisfied without
      # installing a particular npm by hand.
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - run: vp check
      - run: vp test
        working-directory: packages/suraido

      # The showcase imports suraido.js, which the workspace serves from dist.
      - run: vp pack
        working-directory: packages/suraido

      - run: vp build
        working-directory: examples/showcase
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
